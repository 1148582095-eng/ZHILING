    /* ====================================================
       流程设计模式 (新增模板)
       信息弹窗 -> 全屏低代码流程设计器 -> 发布
       ==================================================== */
    let processDraft = null;
    let selectedNodeId = null;
    let selectedFieldId = null;

    function openProcessInfoModal(opts) {
      processDraft = {
        id: null,
        direction: '下发',
        category: '',
        name: '',
        desc: '',
        scope: opts.scope,
        org: opts.org || '',
        nodes: null
      };

      openModalCustom(`
        <div class="mt-modal-inner" style="max-width: 560px; width: 560px;">
          <div class="mt-modal-header">
            <h3 class="mt-modal-title">新增模板</h3>
            <button class="mt-modal-close" onclick="closeModal()">✕</button>
          </div>
          <div class="mt-modal-body">
            ${opts.scope === 'org' ? `
              <div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#1e293b;margin-bottom:18px;">
                <i data-lucide="landmark" width="18" height="18" style="color:#60a5fa;"></i>
                <span>${opts.org}</span>
              </div>
            ` : ''}
            <div class="mt-modal-row" style="margin-bottom: 18px;">
              <label class="mt-modal-label" style="width: 84px; min-width: 84px;"><span class="req">*</span>流程流向</label>
              <div class="mt-modal-control">
                <div class="mt-flow-direction-group">
                  <button type="button" class="mt-flow-dir-btn active" id="flowDirBtn_down" onclick="setProcessDirection('下发')">
                    <i data-lucide="arrow-down-to-line" width="14" height="14"></i>
                    <span>下发</span>
                  </button>
                  <button type="button" class="mt-flow-dir-btn" id="flowDirBtn_up" onclick="setProcessDirection('上报')">
                    <i data-lucide="arrow-up-from-line" width="14" height="14"></i>
                    <span>上报</span>
                  </button>
                </div>
              </div>
            </div>
            <div class="mt-modal-row" style="margin-bottom: 18px;">
              <label class="mt-modal-label" style="width: 84px; min-width: 84px;"><span class="req">*</span>业务类别</label>
              <div class="mt-modal-control" style="flex:1;">
                <select class="mt-input-text" id="processCatSelect" onchange="processDraft.category=this.value" style="width:100%;">
                  <option value="">请选择业务类别</option>
                  <option value="舆情处置">舆情处置</option>
                  <option value="错误表述">错误表述</option>
                </select>
              </div>
            </div>
            <div class="mt-modal-row" style="margin-bottom: 18px;">
              <label class="mt-modal-label" style="width: 84px; min-width: 84px;"><span class="req">*</span>流程名称</label>
              <div class="mt-modal-control" style="flex:1;">
                <div class="mt-input-with-count">
                  <input type="text" id="processNameInput" placeholder="请输入流程名称" maxlength="50" oninput="processDraft.name=this.value; document.getElementById('processNameCount').innerText=this.value.length+' / 50'">
                  <span id="processNameCount" class="mt-input-count">0 / 50</span>
                </div>
              </div>
            </div>
            <div class="mt-modal-row" style="margin-bottom: 4px; align-items: flex-start;">
              <label class="mt-modal-label" style="width: 84px; min-width: 84px; margin-top: 8px;">流程说明</label>
              <div class="mt-modal-control" style="flex:1; position: relative;">
                <textarea id="processDescInput" placeholder="请输入流程说明" maxlength="200" rows="4" style="width:100%; box-sizing:border-box; resize:none; border:1px solid #d9d9d9; border-radius:4px; padding:8px 10px 20px; font-size:14px; font-family:inherit; outline:none; color:#1e293b;" oninput="processDraft.desc=this.value; document.getElementById('processDescCount').innerText=this.value.length+' / 200'"></textarea>
                <span id="processDescCount" class="mt-input-count" style="position:absolute; right:10px; bottom:6px;">0 / 200</span>
              </div>
            </div>
          </div>
          <div class="mt-modal-footer">
            <button class="mt-btn-cancel" onclick="closeModal()">取消</button>
            <button class="mt-btn-confirm" onclick="confirmProcessInfo()">确认并进入设计</button>
          </div>
        </div>
      `);
    }

    function setProcessDirection(dir) {
      processDraft.direction = dir;
      const downBtn = document.getElementById('flowDirBtn_down');
      const upBtn = document.getElementById('flowDirBtn_up');
      if (downBtn) downBtn.classList.toggle('active', dir === '下发');
      if (upBtn) upBtn.classList.toggle('active', dir === '上报');
    }

    function confirmProcessInfo() {
      if (!processDraft.name || !processDraft.name.trim()) {
        showToast('请输入流程名称');
        return;
      }
      if (!processDraft.category) {
        showToast('请选择业务类别');
        return;
      }
      closeModal();
      openProcessDesigner();
    }

    function genNodeId() {
      return 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    }
    function genFieldId() {
      return 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    }

    /* ---- Field type meta (Step 1: 表单配置) ---- */
    function fieldTypeMeta(type) {
      const map = {
        text: { icon: 'type', label: '单行文本' },
        textarea: { icon: 'align-left', label: '多行文本' },
        date: { icon: 'calendar', label: '日期选择' },
        select: { icon: 'chevron-down-circle', label: '下拉单选' },
        file: { icon: 'paperclip', label: '附件上传' },
        number: { icon: 'hash', label: '数字输入' }
      };
      return map[type] || map.text;
    }

    const FIELD_PALETTE = [
      { type: 'text', desc: '用于输入简短的标题、姓名等信息' },
      { type: 'textarea', desc: '用于输入详细描述、反馈等长文本' },
      { type: 'date', desc: '用于记录发生时间、截止时间等' },
      { type: 'select', desc: '从预设选项列表中单选一项' },
      { type: 'file', desc: '支持上传图片、文档、音视频等佐证材料' },
      { type: 'number', desc: '用于输入涉事人数、金额等数值' }
    ];

    function defaultFormFields(direction, category) {
      const isReport = direction === '上报';
      if (category === '错误表述') {
        return [
          { id: genFieldId(), type: 'text', label: '差错标题', placeholder: '请输入差错简要标题', required: true, help: '简明提炼差错事项核心内容' },
          { id: genFieldId(), type: 'date', label: '发现/核实时间', placeholder: '请选择核实时间', required: true, help: '首次发现或核实的基准时间' },
          { id: genFieldId(), type: 'select', label: '差错来源渠道', placeholder: '请选择第一发现渠道', required: true, help: '如实选择第一信息来源' },
          { id: genFieldId(), type: 'select', label: '差错级别', placeholder: '请评估差错等级', required: true, help: '根据影响范围与性质综合评定' },
          { id: genFieldId(), type: 'text', label: '涉及文件/载体', placeholder: '请输入涉及的文件、载体名称', required: false, help: '便于追溯核查取证' },
          { id: genFieldId(), type: 'textarea', label: '差错主要内容与焦点', placeholder: '客观概述差错内容与核心问题...', required: true, help: '符合政务差错采集规范' },
          { id: genFieldId(), type: 'select', label: '涉及部门/责任科室', placeholder: '请选择责任科室', required: true, help: '确定后续办理主体' },
          { id: genFieldId(), type: 'number', label: '涉及人数/影响范围', placeholder: '请输入预估影响人数', required: false, help: '用于评估处置优先级' },
          { id: genFieldId(), type: 'file', label: '佐证材料附件', placeholder: '支持上传截图、文档等材料', required: false, help: '支持上传图片、文档、音视频等' }
        ];
      }
      return [
        { id: genFieldId(), type: 'text', label: '舆情标题', placeholder: '请输入舆情简要标题（例如：某片区涉企政务服务引发现网关切）', required: true, help: '简明提炼涉事事件核心焦点与发生地' },
        { id: genFieldId(), type: 'date', label: isReport ? '发现/上报时间' : '发现/监测时间', placeholder: '请选择监测发现时间', required: true, help: '首发预警或监测发现的基准时间' },
        { id: genFieldId(), type: 'select', label: '舆情来源渠道', placeholder: '请选择主要涉事平台', required: true, help: '请如实选择第一信息发源或主要传播途径' },
        { id: genFieldId(), type: 'select', label: '舆情预警级别', placeholder: '请评估初核预警级别', required: true, help: '根据扩散传播速率与社会影响审定' },
        { id: genFieldId(), type: 'text', label: '原帖链接 / 涉事账号', placeholder: '请输入首发贴文网页链接或涉事发布主体账号', required: false, help: '便于责任单位溯源核查取证' },
        { id: genFieldId(), type: 'textarea', label: '舆情主要内容与焦点', placeholder: '客观概述涉事主要事实、网民核心质疑点与当前扩散态势...', required: true, help: '符合政务舆情采集规范' },
        { id: genFieldId(), type: 'select', label: '涉及部门/责任科室', placeholder: '请选择对口责任科室', required: true, help: '确定后续办理主体' },
        { id: genFieldId(), type: 'number', label: '涉及人数/影响范围', placeholder: '请输入预估传播人数或影响范围', required: false, help: '用于评估处置优先级与预警等级' },
        { id: genFieldId(), type: 'file', label: '佐证材料附件', placeholder: '支持上传截图、文档等材料', required: false, help: '支持上传图片、文档、音视频等佐证材料' }
      ];
    }

    /* ---- Node type meta (Step 2: 流程配置) ---- */
    function nodeTypeMeta(type) {
      const map = {
        start: { icon: 'flag', color: '#2f80ed', label: '开始', tag: '发起填报', tagColor: '#52c41a' },
        handle: { icon: 'wrench', color: '#1677ff', label: '办理节点', tag: '现场处置', tagColor: '#1677ff' },
        approve: { icon: 'user-check', color: '#fa8c16', label: '审批节点', tag: '人工审核', tagColor: '#d46b08' },
        branch: { icon: 'git-branch', color: '#722ed1', label: '条件分支', tag: '自动分流', tagColor: '#722ed1' },
        cc: { icon: 'send', color: '#13c2c2', label: '抄送节点', tag: '知会告知', tagColor: '#13c2c2' },
        end: { icon: 'flag-off', color: '#475569', label: '结束', tag: '流程办结', tagColor: '#334155' }
      };
      return map[type] || map.handle;
    }

    const NODE_LIBRARY = [
      { type: 'handle', title: '办理节点 (支持转办)', sub: '指派责任科室或承办人...' },
      { type: 'approve', title: '审批节点 (通过/驳回)', sub: '创建人或科室领导验收...' },
      { type: 'branch', title: '条件分支', sub: '根据预警级别、差错严...' },
      { type: 'cc', title: '抄送节点', sub: '将处置进展与整改通告...' }
    ];

    function defaultProcessNodes(direction, category) {
      const isReport = direction === '上报';
      const subject = isReport ? '承办单位 / 科室' : '对口责任科室 / 承办人员';
      return [
        {
          id: 'start', type: 'start',
          name: isReport ? '创建人发起上报事项' : '创建人发起与处置要求',
          desc: isReport
            ? '由创建人登记事项基本信息，明确上报口径、核实重点与办理时限'
            : '由创建人登记业务基本信息，并明确具体处置要求、核查重点与办理时限',
          subjectType: '指定个人', subjects: ['创建人本人'], allowTransfer: false, timeLimit: 0, signMode: ''
        },
        {
          id: genNodeId(), type: 'handle',
          name: isReport ? '承办单位核实上报' : '处理人核查处置',
          desc: isReport
            ? '承办单位/科室核实事项并录入上报材料；如权责不符可申请转办至其他单位'
            : '对口责任科室/承办处理人落地处置并录入反馈；如权责不符可申请转办至其他单位',
          subjectType: '业务部门', subjects: [subject], allowTransfer: true, timeLimit: 4, signMode: '或签（一名通过即生效）'
        },
        {
          id: genNodeId(), type: 'approve',
          name: '创建人复核审批',
          desc: '创建人验收处置成效：审核通过则办结归档；审核驳回则退回处理人重新处置整改',
          subjectType: '指定个人', subjects: ['创建人本人'], allowTransfer: false, timeLimit: 2, signMode: '或签（一名通过即生效）'
        },
        {
          id: 'end', type: 'end',
          name: '办结归档',
          desc: '创建人验收审批通过，处置闭环入库形成台账记录',
          subjectType: '', subjects: [], allowTransfer: false, timeLimit: 0, signMode: ''
        }
      ];
    }

    function openProcessDesigner() {
      if (!processDraft.formFields) processDraft.formFields = defaultFormFields(processDraft.direction, processDraft.category);
      if (!processDraft.nodes) processDraft.nodes = defaultProcessNodes(processDraft.direction, processDraft.category);
      if (!processDraft.step) processDraft.step = 1;
      selectedFieldId = processDraft.formFields[0] ? processDraft.formFields[0].id : null;
      const midNode = processDraft.nodes.find(n => n.type !== 'start' && n.type !== 'end');
      selectedNodeId = midNode ? midNode.id : null;

      let root = document.getElementById('processDesignerRoot');
      if (!root) {
        root = document.createElement('div');
        root.id = 'processDesignerRoot';
        document.body.appendChild(root);
      }
      root.innerHTML = renderProcessDesignerHtml();
      root.classList.add('show');
      lucide.createIcons();
    }

    function closeProcessDesigner() {
      const root = document.getElementById('processDesignerRoot');
      if (root) {
        root.classList.remove('show');
        root.innerHTML = '';
      }
      processDraft = null;
      selectedNodeId = null;
      selectedFieldId = null;
    }

    function genProcessCode(d) {
      if (!d.code) {
        d.code = 'WF-' + (d.direction === '上报' ? 'SB' : 'XF') + '-' + String(Math.floor(100 + Math.random() * 900));
      }
      return d.code;
    }

    function renderProcessDesignerHtml() {
      const d = processDraft;
      const fieldCount = (d.formFields || []).length;
      const nodeCount = (d.nodes || []).length;
      return `
        <div class="pd-topbar">
          <div class="pd-topbar-left">
            <button class="pd-back-btn" onclick="exitProcessDesigner()" title="返回">
              <i data-lucide="arrow-left" width="16" height="16"></i>
              <span style="font-size:12px;margin-left:4px;">流程列表</span>
            </button>
            <span class="pd-doc-icon"><i data-lucide="file-text" width="15" height="15"></i></span>
            <span class="pd-title-name">${d.name || '未命名流程'}</span>
            <span class="pd-code-badge">${genProcessCode(d)}</span>
            <span class="pd-tag-badge">${d.scope === 'org' ? '机构模板' : '政务标准版'}</span>
            <span class="pd-saved-status"><i data-lucide="check-circle-2" width="13" height="13"></i>已保存至列表</span>
          </div>
          <div class="pd-steps">
            <div class="pd-step-item ${d.step === 1 ? 'active' : 'done'}" onclick="goToDesignerStep(1)">
              <span class="pd-step-num">${d.step === 1 ? '1' : '<i data-lucide="check" width="11" height="11"></i>'}</span>
              <span>表单配置</span><span class="pd-step-count">${fieldCount}项</span>
            </div>
            <i data-lucide="chevron-right" width="14" height="14" class="pd-step-arrow"></i>
            <div class="pd-step-item ${d.step === 2 ? 'active' : ''}" onclick="goToDesignerStep(2)">
              <span class="pd-step-num">2</span>
              <span><i data-lucide="git-fork" width="11" height="11" style="vertical-align:-1px;margin-right:2px;"></i>流程配置</span><span class="pd-step-count">${nodeCount}节</span>
            </div>
          </div>
          <div class="pd-topbar-right">
            ${d.step === 1 ? `
              <button class="btn btn-default" onclick="restoreProcessSample()"><i data-lucide="rotate-ccw" width="14" height="14"></i><span>恢复示例</span></button>
              <button class="btn btn-default" style="color:#ff4d4f;border-color:#ffccc7;" onclick="clearProcessFields()"><i data-lucide="trash-2" width="14" height="14"></i><span>清空</span></button>
              <button class="btn btn-default" onclick="saveProcessDraft()"><i data-lucide="save" width="14" height="14"></i><span>保存</span></button>
              <button class="btn btn-primary" onclick="goToDesignerStep(2)"><span>下一步：流程配置</span><i data-lucide="arrow-right" width="14" height="14"></i></button>
              <button class="btn btn-default" onclick="previewProcessDesign()"><i data-lucide="eye" width="14" height="14"></i><span>预览</span></button>
            ` : `
              <button class="btn btn-default" onclick="goToDesignerStep(1)"><i data-lucide="arrow-left" width="14" height="14"></i><span>返回表单</span></button>
              <button class="btn btn-default" onclick="saveProcessDraft()"><i data-lucide="save" width="14" height="14"></i><span>保存</span></button>
              <button class="btn btn-default" onclick="previewProcessDesign()"><i data-lucide="eye" width="14" height="14"></i><span>预览</span></button>
              <button class="btn btn-primary" onclick="publishProcessDesign()"><i data-lucide="rocket" width="14" height="14"></i><span>发布</span></button>
            `}
          </div>
        </div>
        <div class="pd-body3" onclick="closeAllInsertMenus()">
          ${d.step === 1 ? renderFormConfigStep() : renderFlowConfigStep()}
        </div>
      `;
    }

    function goToDesignerStep(step) {
      processDraft.step = step;
      const root = document.getElementById('processDesignerRoot');
      if (root) root.innerHTML = renderProcessDesignerHtml();
      lucide.createIcons();
    }

    function saveProcessDraft() {
      showToast('已保存至列表');
    }

    function restoreProcessSample() {
      processDraft.formFields = defaultFormFields(processDraft.direction, processDraft.category);
      selectedFieldId = processDraft.formFields[0] ? processDraft.formFields[0].id : null;
      refreshFormConfigStep();
      showToast('已恢复示例表单');
    }

    function clearProcessFields() {
      processDraft.formFields = [];
      selectedFieldId = null;
      refreshFormConfigStep();
    }

    /* ============ Step 1: 表单配置 ============ */
    function renderFormConfigStep() {
      return `
        <div class="pd-palette">
          <div class="pd-palette-header"><i data-lucide="layers" width="16" height="16"></i><span>常用表单控件</span><span class="pd-palette-count">${FIELD_PALETTE.length}个</span></div>
          <div class="pd-palette-hint"><i data-lucide="info" width="13" height="13"></i><span>点击控件即可追加至表单末尾，或按需调整顺序与属性。</span></div>
          <div class="pd-palette-grid">
            ${FIELD_PALETTE.map(f => {
              const meta = fieldTypeMeta(f.type);
              return `
                <div class="pd-palette-item" onclick="event.stopPropagation();addFormField('${f.type}')">
                  <span class="pd-palette-item-icon"><i data-lucide="${meta.icon}" width="16" height="16"></i></span>
                  <span class="pd-palette-item-label">${meta.label}</span>
                </div>
              `;
            }).join('')}
          </div>
          <div class="pd-palette-sub">控件适用说明</div>
          <div class="pd-palette-help-list">
            ${FIELD_PALETTE.map(f => `<div class="pd-palette-help-item"><b>${fieldTypeMeta(f.type).label}</b><span>${f.desc}</span></div>`).join('')}
          </div>
          <div class="pd-palette-footnote">符合政务舆情采集规范</div>
        </div>
        <div class="pd-form-canvas-wrap">
          <div class="pd-form-card">
            ${renderFormFieldsHtml()}
          </div>
        </div>
        <div class="pd-panel">
          ${renderFormFieldPanel()}
        </div>
      `;
    }

    function refreshFormConfigStep() {
      const root = document.getElementById('processDesignerRoot');
      if (root) root.innerHTML = renderProcessDesignerHtml();
      lucide.createIcons();
    }

    function renderFormFieldsHtml() {
      const fields = processDraft.formFields || [];
      const d = processDraft;
      const catLabel = d.category === '错误表述' ? '差错上报单' : '舆情上报单';
      const catDesc = d.category === '错误表述'
        ? '用于单位政务差错事项登记、核实研判与协同处置流程，标 * 项为必填项。'
        : '用于单位网络舆情事件登记、研判分析与协同处置流程，标 * 项为必填项。';
      return `
        <div class="pd-form-card-top">
          <div>
            <span class="pd-form-badge"><i data-lucide="shield-check" width="12" height="12"></i>统一规范表单模板</span>
          </div>
          <span class="pd-form-code">编号：${d.category === '错误表述' ? 'CW' : 'YQ'}-FORM-${new Date().getFullYear()}</span>
        </div>
        <div class="pd-form-title">${catLabel}</div>
        <div class="pd-form-desc">${catDesc}</div>
        ${fields.map((field, idx) => renderFormFieldCard(field, idx, fields.length)).join('')}
        ${fields.length === 0 ? `<div style="text-align:center;padding:60px 0;color:#94a3b8;font-size:13px;">暂无表单字段，请从左侧控件面板添加</div>` : ''}
      `;
    }

    function renderFormFieldCard(field, idx, total) {
      const meta = fieldTypeMeta(field.type);
      const selected = field.id === selectedFieldId;
      const inputHtml = field.type === 'textarea'
        ? `<div class="pd-form-field-fake-input textarea">${field.placeholder || ''}</div>`
        : `<div class="pd-form-field-fake-input">${field.placeholder || ''}</div>`;
      return `
        <div class="pd-form-field ${selected ? 'selected' : ''}" onclick="event.stopPropagation();selectFormField('${field.id}')">
          <span class="pd-form-field-drag"><i data-lucide="grip-vertical" width="14" height="14"></i></span>
          <div class="pd-form-field-toolbar" onclick="event.stopPropagation();">
            <span class="pd-form-field-toolbar-label">${meta.label}</span>
            <button onclick="moveFormField('${field.id}',-1)" title="上移" ${idx === 0 ? 'disabled style="opacity:.35;cursor:not-allowed;"' : ''}><i data-lucide="chevron-up" width="12" height="12"></i></button>
            <button onclick="moveFormField('${field.id}',1)" title="下移" ${idx === total - 1 ? 'disabled style="opacity:.35;cursor:not-allowed;"' : ''}><i data-lucide="chevron-down" width="12" height="12"></i></button>
            <button onclick="duplicateFormField('${field.id}')" title="复制"><i data-lucide="copy" width="12" height="12"></i></button>
            <button class="danger" onclick="deleteFormField('${field.id}')" title="删除"><i data-lucide="trash-2" width="12" height="12"></i></button>
          </div>
          <div class="pd-form-field-label">${field.required ? '<span class=\"req\">*</span>' : ''}${field.label}</div>
          ${inputHtml}
          ${field.help ? `<div class="pd-form-field-help">${field.help}</div>` : ''}
        </div>
      `;
    }

    function renderFormFieldPanel() {
      const fields = processDraft.formFields || [];
      const field = fields.find(f => f.id === selectedFieldId);
      if (!field) {
        return `
          <div class="pd-side-empty" style="height:100%;">
            <i data-lucide="mouse-pointer-click" width="28" height="28"></i>
            <p>点击画布中的字段<br>查看和编辑字段属性</p>
          </div>
        `;
      }
      const meta = fieldTypeMeta(field.type);
      return `
        <div class="pd-panel-header"><i data-lucide="${meta.icon}" width="16" height="16" style="color:#1677ff;"></i><span>${meta.label}</span><span class="pd-panel-id">ID: ${field.id.slice(-8)}</span></div>
        <div class="pd-panel-divider"></div>
        <div class="pd-panel-row">
          <div class="pd-panel-label-row"><span class="pd-panel-label">字段名称</span><span class="pd-panel-label-hint">显示在表单前</span></div>
          <input class="pd-panel-input" value="${field.label}" oninput="updateFormField('${field.id}','label',this.value)">
        </div>
        <div class="pd-panel-row">
          <div class="pd-panel-label-row"><span class="pd-panel-label">占位提示文字</span><span class="pd-panel-label-hint">引导填报</span></div>
          <input class="pd-panel-input" value="${field.placeholder || ''}" oninput="updateFormField('${field.id}','placeholder',this.value)">
        </div>
        <div class="pd-toggle-row">
          <div class="pd-toggle-row-text">
            <span class="pd-toggle-row-title">是否必填项</span>
            <span class="pd-toggle-row-sub">提交时未填将阻止上报并标红提示</span>
          </div>
          <span class="pd-toggle ${field.required ? 'on' : ''}" onclick="toggleFormFieldRequired('${field.id}')"><span class="pd-toggle-dot"></span></span>
        </div>
        <div class="pd-panel-row">
          <div class="pd-panel-label-row"><span class="pd-panel-label">帮助说明文本</span><span class="pd-panel-label-hint">辅助说明（选填）</span></div>
          <textarea class="pd-panel-input" rows="2" oninput="updateFormField('${field.id}','help',this.value)">${field.help || ''}</textarea>
        </div>
        <div class="pd-panel-note"><i data-lucide="info" width="13" height="13"></i><span>修改属性将实时同步至中间画布和模拟预览窗口。</span></div>
        <button class="pd-panel-delete-btn" onclick="deleteFormField('${field.id}')"><i data-lucide="trash-2" width="14" height="14"></i>删除该字段</button>
      `;
    }

    function refreshFormCanvasAndPanel() {
      const wrap = document.querySelector('.pd-form-card');
      if (wrap) wrap.innerHTML = renderFormFieldsHtml();
      const panel = document.querySelector('.pd-panel');
      if (panel) panel.innerHTML = renderFormFieldPanel();
      lucide.createIcons();
      const header = document.querySelector('.pd-step-item.active .pd-step-count');
      if (header) header.textContent = `${(processDraft.formFields || []).length}项`;
    }

    function addFormField(type) {
      const meta = fieldTypeMeta(type);
      const newField = { id: genFieldId(), type, label: meta.label, placeholder: `请输入${meta.label}`, required: false, help: '' };
      if (!processDraft.formFields) processDraft.formFields = [];
      processDraft.formFields.push(newField);
      selectedFieldId = newField.id;
      refreshFormCanvasAndPanel();
    }

    function selectFormField(id) {
      selectedFieldId = id;
      refreshFormCanvasAndPanel();
    }

    function updateFormField(id, key, val) {
      const field = (processDraft.formFields || []).find(f => f.id === id);
      if (field) field[key] = val;
      const wrap = document.querySelector('.pd-form-card');
      if (wrap) wrap.innerHTML = renderFormFieldsHtml();
      lucide.createIcons();
    }

    function toggleFormFieldRequired(id) {
      const field = (processDraft.formFields || []).find(f => f.id === id);
      if (field) field.required = !field.required;
      refreshFormCanvasAndPanel();
    }

    function deleteFormField(id) {
      processDraft.formFields = (processDraft.formFields || []).filter(f => f.id !== id);
      if (selectedFieldId === id) selectedFieldId = processDraft.formFields[0] ? processDraft.formFields[0].id : null;
      refreshFormCanvasAndPanel();
    }

    function duplicateFormField(id) {
      const fields = processDraft.formFields || [];
      const idx = fields.findIndex(f => f.id === id);
      if (idx === -1) return;
      const copy = JSON.parse(JSON.stringify(fields[idx]));
      copy.id = genFieldId();
      copy.label = copy.label + ' (副本)';
      fields.splice(idx + 1, 0, copy);
      selectedFieldId = copy.id;
      refreshFormCanvasAndPanel();
    }

    function moveFormField(id, dir) {
      const fields = processDraft.formFields || [];
      const idx = fields.findIndex(f => f.id === id);
      const newIdx = idx + dir;
      if (idx === -1 || newIdx < 0 || newIdx >= fields.length) return;
      const [item] = fields.splice(idx, 1);
      fields.splice(newIdx, 0, item);
      refreshFormCanvasAndPanel();
    }

    /* ============ Step 2: 流程配置 ============ */
    function renderFlowConfigStep() {
      return `
        <div class="pd-palette">
          <div class="pd-palette-header"><i data-lucide="git-fork" width="16" height="16"></i><span>流转节点库</span><span class="pd-palette-count">${NODE_LIBRARY.length}个节点</span></div>
          <div class="pd-palette-hint"><i data-lucide="info" width="13" height="13"></i><span>点击节点库中的类型即可插入至画布末尾节点之前，或点击画布中的“+”指定位置插入。</span></div>
          <div class="pd-palette-sub">政务审批流节点</div>
          ${NODE_LIBRARY.map(lib => {
            const meta = nodeTypeMeta(lib.type);
            return `
              <div class="pd-lib-item" onclick="event.stopPropagation();appendProcessNode('${lib.type}')">
                <span class="pd-lib-item-icon" style="background:${meta.color}1a;color:${meta.color};"><i data-lucide="${meta.icon}" width="16" height="16"></i></span>
                <div>
                  <div class="pd-lib-item-title">${lib.title}</div>
                  <div class="pd-lib-item-sub">${lib.sub}</div>
                </div>
              </div>
            `;
          }).join('')}
          <div class="pd-palette-sub">政务协同流转规则</div>
          <div class="pd-lib-rule-list">
            <div class="pd-lib-rule-item"><span class="pd-lib-rule-dot" style="background:#fa8c16;"></span><span><b>审批节点：</b>支持会签（全员过审）、或签（一人即审）及限时超时预警。</span></div>
            <div class="pd-lib-rule-item"><span class="pd-lib-rule-dot" style="background:#1677ff;"></span><span><b>办理节点：</b>指派执法巡查、综合治理或街道办进行线下核实。</span></div>
            <div class="pd-lib-rule-item"><span class="pd-lib-rule-dot" style="background:#722ed1;"></span><span><b>条件分支：</b>结合舆情重要等级/舆情来源自动分流。</span></div>
          </div>
        </div>
        <div class="pd-flow-canvas-wrap">
          <div class="pd-flow-canvas-header">
            <span class="dot"></span>
            <span>点击节点卡片可在右侧配置审批人员、时限及流转分支</span>
            <span class="count">共 ${(processDraft.nodes || []).length} 个流转环节</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;">
            ${renderProcessNodesHtml()}
          </div>
        </div>
        <div class="pd-panel">
          ${renderProcessSidePanel()}
        </div>
      `;
    }

    function renderProcessNodesHtml() {
      const nodes = processDraft.nodes;
      let html = '';
      nodes.forEach((node, idx) => {
        const meta = nodeTypeMeta(node.type);
        const isFixed = node.type === 'start' || node.type === 'end';
        const selected = node.id === selectedNodeId;
        const chips = buildNodeChips(node);
        html += `
          <div class="pd-flow-node ${selected ? 'selected' : ''}" onclick="event.stopPropagation();selectProcessNode('${node.id}')">
            <div class="pd-flow-node-top">
              <span class="pd-flow-node-icon" style="background:${meta.color}1a;color:${meta.color};"><i data-lucide="${meta.icon}" width="14" height="14"></i></span>
              <span class="pd-flow-node-name">${node.name}</span>
              <span class="pd-flow-node-tag" style="background:${meta.tagColor}1a;color:${meta.tagColor};">${meta.tag}</span>
              ${!isFixed ? `<span class="pd-flow-node-drag"><i data-lucide="grip-vertical" width="14" height="14"></i></span>` : ''}
            </div>
            <div class="pd-flow-node-desc">${node.desc || ''}</div>
            <div class="pd-flow-node-chips">
              ${chips.map(c => `<span class="pd-flow-node-chip ${c.color}"><i data-lucide="${c.icon}" width="10" height="10"></i>${c.text}</span>`).join('')}
            </div>
            ${!isFixed ? `<button type="button" class="pd-flow-node-del" onclick="event.stopPropagation();deleteProcessNode('${node.id}')" title="删除节点"><i data-lucide="x" width="13" height="13"></i></button>` : ''}
          </div>
        `;
        if (idx < nodes.length - 1) {
          html += `
            <div class="pd-flow-connector">
              <div class="pd-connector-line"></div>
              <button type="button" class="pd-add-btn" onclick="event.stopPropagation();toggleInsertMenu(event, ${idx})" title="添加节点">
                <i data-lucide="plus" width="14" height="14"></i>
              </button>
              <div class="pd-insert-menu" id="pdInsertMenu_${idx}">
                <div class="pd-insert-item" onclick="event.stopPropagation();insertProcessNode(${idx}, 'handle')"><i data-lucide="wrench" width="14" height="14"></i><span>办理节点</span></div>
                <div class="pd-insert-item" onclick="event.stopPropagation();insertProcessNode(${idx}, 'approve')"><i data-lucide="user-check" width="14" height="14"></i><span>审批节点</span></div>
                <div class="pd-insert-item" onclick="event.stopPropagation();insertProcessNode(${idx}, 'branch')"><i data-lucide="git-branch" width="14" height="14"></i><span>条件分支</span></div>
                <div class="pd-insert-item" onclick="event.stopPropagation();insertProcessNode(${idx}, 'cc')"><i data-lucide="send" width="14" height="14"></i><span>抄送节点</span></div>
              </div>
            </div>
          `;
        }
      });
      return html;
    }

    function buildNodeChips(node) {
      if (node.type === 'start') {
        return [{ icon: 'user', color: '', text: (node.subjects && node.subjects[0]) || '创建人本人' }];
      }
      if (node.type === 'end') {
        return [{ icon: 'archive', color: '', text: '归档入库' }];
      }
      const chips = [];
      chips.push({ icon: 'users', color: '', text: (node.subjects && node.subjects[0]) || '待指派' });
      if (node.signMode) chips.push({ icon: 'check-check', color: 'orange', text: node.signMode });
      if (node.timeLimit) chips.push({ icon: 'clock', color: 'red', text: `限时${node.timeLimit}h` });
      if (node.type === 'handle' && node.allowTransfer) chips.push({ icon: 'repeat', color: 'blue', text: '处理人可转办' });
      if (node.type === 'approve') {
        chips.push({ icon: 'corner-up-left', color: 'red', text: '驳回退回处理人' });
        chips.push({ icon: 'check', color: 'green', text: '通过即归档' });
      }
      return chips;
    }

    function toggleInsertMenu(e, idx) {
      e.stopPropagation();
      document.querySelectorAll('.pd-insert-menu').forEach(m => {
        if (m.id !== `pdInsertMenu_${idx}`) m.classList.remove('show');
      });
      const menu = document.getElementById(`pdInsertMenu_${idx}`);
      if (menu) menu.classList.toggle('show');
    }

    function closeAllInsertMenus() {
      document.querySelectorAll('.pd-insert-menu').forEach(m => m.classList.remove('show'));
    }

    function newNodeDefaults(type) {
      const meta = nodeTypeMeta(type);
      return {
        id: genNodeId(), type, name: meta.label,
        desc: '请填写该环节的处置说明与审批指引',
        subjectType: '业务部门', subjects: [], allowTransfer: type === 'handle', timeLimit: 4,
        signMode: type === 'approve' || type === 'handle' ? '或签（一名通过即生效）' : ''
      };
    }

    function insertProcessNode(afterIdx, type) {
      const newNode = newNodeDefaults(type);
      processDraft.nodes.splice(afterIdx + 1, 0, newNode);
      selectedNodeId = newNode.id;
      refreshProcessCanvas();
    }

    function appendProcessNode(type) {
      const newNode = newNodeDefaults(type);
      const endIdx = processDraft.nodes.findIndex(n => n.type === 'end');
      const insertAt = endIdx === -1 ? processDraft.nodes.length : endIdx;
      processDraft.nodes.splice(insertAt, 0, newNode);
      selectedNodeId = newNode.id;
      refreshProcessCanvas();
    }

    function deleteProcessNode(id) {
      processDraft.nodes = processDraft.nodes.filter(n => n.id !== id);
      if (selectedNodeId === id) selectedNodeId = null;
      refreshProcessCanvas();
    }

    function selectProcessNode(id) {
      selectedNodeId = id;
      refreshProcessCanvas();
    }

    function refreshProcessCanvas() {
      const canvas = document.querySelector('.pd-flow-canvas-wrap > div');
      if (canvas) canvas.innerHTML = renderProcessNodesHtml();
      const countEl = document.querySelector('.pd-flow-canvas-header .count');
      if (countEl) countEl.textContent = `共 ${(processDraft.nodes || []).length} 个流转环节`;
      const stepCount = document.querySelectorAll('.pd-step-count')[1];
      if (stepCount) stepCount.textContent = `${(processDraft.nodes || []).length}节`;
      const side = document.querySelector('.pd-panel');
      if (side) side.innerHTML = renderProcessSidePanel();
      lucide.createIcons();
    }

    function renderProcessSidePanel() {
      const node = (processDraft.nodes || []).find(n => n.id === selectedNodeId);
      if (!node) {
        return `
          <div class="pd-side-empty" style="height:100%;">
            <i data-lucide="mouse-pointer-click" width="28" height="28"></i>
            <p>点击画布中的节点<br>查看和编辑节点属性</p>
          </div>
        `;
      }
      const meta = nodeTypeMeta(node.type);
      const isFixed = node.type === 'start' || node.type === 'end';

      if (isFixed) {
        return `
          <div class="pd-panel-header"><i data-lucide="${meta.icon}" width="16" height="16" style="color:${meta.color};"></i><span>${meta.label}节点</span><span class="pd-panel-id">ID: ${node.id}</span></div>
          <div class="pd-panel-divider"></div>
          <div class="pd-panel-row">
            <div class="pd-panel-label-row"><span class="pd-panel-label">节点环节名称</span></div>
            <input class="pd-panel-input" value="${node.name}" disabled>
          </div>
          <div class="pd-panel-row">
            <div class="pd-panel-label-row"><span class="pd-panel-label">说明</span></div>
            <textarea class="pd-panel-input" rows="3" disabled>${node.desc || ''}</textarea>
          </div>
          <div class="pd-panel-note"><i data-lucide="lock" width="13" height="13"></i><span>${node.type === 'start' ? '发起节点固定为创建人本人，不可编辑或删除。' : '结束节点为流程固定归档环节，不可编辑或删除。'}</span></div>
        `;
      }

      const subjectTypes = ['职务角色', '业务部门', '指定个人'];
      const quickAddOptions = node.type === 'approve'
        ? ['创建人本人', '科室领导', '分管负责人']
        : ['城管综合执法支队', '区应急管理局值班室', '属地街道办事处', '交警大队指挥中心', '生态环境分局'];

      return `
        <div class="pd-panel-header"><i data-lucide="${meta.icon}" width="16" height="16" style="color:${meta.color};"></i><span>${meta.label}属性</span><span class="pd-panel-id">ID: ${node.id.slice(0,7)}</span></div>
        <div class="pd-panel-divider"></div>
        <div class="pd-panel-row">
          <div class="pd-panel-label-row"><span class="pd-panel-label">节点环节名称</span></div>
          <input class="pd-panel-input" value="${node.name}" oninput="updateNodeField('${node.id}','name',this.value)">
        </div>
        <div class="pd-panel-row">
          <div class="pd-panel-label-row"><span class="pd-panel-label">处置说明 / 审批指引</span></div>
          <textarea class="pd-panel-input" rows="3" oninput="updateNodeField('${node.id}','desc',this.value)">${node.desc || ''}</textarea>
        </div>
        <div class="pd-panel-row">
          <div class="pd-panel-label-row"><span class="pd-panel-label">设置处理主体类型</span></div>
          <div class="pd-subject-tabs">
            ${subjectTypes.map(t => `<span class="pd-subject-tab ${node.subjectType === t ? 'active' : ''}" onclick="updateNodeField('${node.id}','subjectType','${t}')">${t}</span>`).join('')}
          </div>
          <div class="pd-panel-label-row"><span class="pd-panel-label" style="font-size:12px;color:#94a3b8;font-weight:400;">当前已指派主体：</span><span class="pd-panel-label-hint">${(node.subjects||[]).length}个</span></div>
          <div class="pd-subject-tags">
            ${(node.subjects || []).map(s => `<span class="pd-subject-tag">${s}<i data-lucide="x" width="11" height="11" onclick="removeNodeSubject('${node.id}','${s.replace(/'/g,"\\'")}')"></i></span>`).join('') || '<span style="font-size:12px;color:#cbd5e1;">暂未指派，请从下方快捷添加</span>'}
          </div>
          <div class="pd-quick-add-label">快捷添加候选部门/角色：</div>
          <div class="pd-quick-add-btns">
            ${quickAddOptions.map(o => `<span class="pd-quick-add-btn" onclick="addNodeSubject('${node.id}','${o.replace(/'/g,"\\'")}')">+ ${o}</span>`).join('')}
          </div>
        </div>
        <div class="pd-toggle-row">
          <div class="pd-toggle-row-text">
            <span class="pd-toggle-row-title">允许处理人转办</span>
            <span class="pd-toggle-row-sub">若涉及跨部门或非本权责，处理人可申请转办</span>
          </div>
          <span class="pd-toggle ${node.allowTransfer ? 'on' : ''}" onclick="toggleNodeTransfer('${node.id}')"><span class="pd-toggle-dot"></span></span>
        </div>
        <div class="pd-panel-row">
          <div class="pd-panel-label-row"><span class="pd-panel-label">审批时效限制（小时）</span><span class="pd-panel-label-hint">政务响应考核</span></div>
          <div class="pd-input-suffix-row">
            <input type="number" min="0" class="pd-panel-input" value="${node.timeLimit || 0}" oninput="updateNodeField('${node.id}','timeLimit',this.value)">
            <span class="pd-input-suffix-text">小时内未办自动短信催办</span>
          </div>
        </div>
        <button class="pd-panel-delete-btn" onclick="deleteProcessNode('${node.id}')"><i data-lucide="trash-2" width="14" height="14"></i>删除当前流转节点</button>
      `;
    }

    function updateNodeField(id, key, val) {
      const node = (processDraft.nodes || []).find(n => n.id === id);
      if (!node) return;
      node[key] = key === 'timeLimit' ? Number(val) || 0 : val;
      const canvas = document.querySelector('.pd-flow-canvas-wrap > div');
      if (canvas) canvas.innerHTML = renderProcessNodesHtml();
      if (key === 'subjectType') {
        const side = document.querySelector('.pd-panel');
        if (side) side.innerHTML = renderProcessSidePanel();
      }
      lucide.createIcons();
    }

    function addNodeSubject(id, subject) {
      const node = (processDraft.nodes || []).find(n => n.id === id);
      if (!node) return;
      if (!node.subjects) node.subjects = [];
      if (!node.subjects.includes(subject)) node.subjects.push(subject);
      refreshProcessCanvas();
    }

    function removeNodeSubject(id, subject) {
      const node = (processDraft.nodes || []).find(n => n.id === id);
      if (!node) return;
      node.subjects = (node.subjects || []).filter(s => s !== subject);
      refreshProcessCanvas();
    }

    function toggleNodeTransfer(id) {
      const node = (processDraft.nodes || []).find(n => n.id === id);
      if (!node) return;
      node.allowTransfer = !node.allowTransfer;
      refreshProcessCanvas();
    }

    function exitProcessDesigner() {
      openModalCustom(`
        <div class="mt-modal-inner" style="max-width: 420px; width: 420px; padding: 24px 28px 20px;">
          <div class="mt-confirm-header" style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
            <span class="mt-confirm-icon" style="background:#fa8c16; color:#fff; width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px;">!</span>
            <span class="mt-confirm-title" style="font-size:16px; font-weight:700; color:#1e293b;">退出流程设计？</span>
          </div>
          <div class="mt-confirm-desc" style="margin-left:32px; font-size:14px; color:#595959;">
            当前设计内容尚未发布，退出后<span style="color:#ff4d4f;">修改将不会保存</span>。
          </div>
          <div class="mt-modal-footer" style="margin-top:24px; justify-content:flex-end; gap:10px;">
            <button class="mt-btn-cancel" onclick="closeModal()">继续设计</button>
            <button class="mt-btn-confirm" onclick="closeModal();closeProcessDesigner();">确认退出</button>
          </div>
        </div>

    function publishProcessDesign() {
      if (!processDraft.nodes || processDraft.nodes.length < 2) {
        showToast('流程节点配置不完整');
        return;
      }
      const now = new Date();
      const createTime = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      const randomHex = Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 8);
      if (!processDraft.id) processDraft.id = 'TP' + randomHex;

      if (processDraft.scope === 'org') {
        const catKeyOrg = processDraft.category === '错误表述' ? 'cwbs' : 'yqcz';
        const record = {
          id: processDraft.id,
          req: processDraft.direction === '下发' ? '限时回执' : '回执',
          type: '机构模板',
          name: processDraft.name,
          createTime: createTime,
          visible: true,
          category: catKeyOrg,
          org: processDraft.org,
          direction: processDraft.direction,
          desc: processDraft.desc,
          status: '已发布',
          nodes: JSON.parse(JSON.stringify(processDraft.nodes)),
          formFields: JSON.parse(JSON.stringify(processDraft.formFields || []))
        };
        const existingIdx = state.orgDetail.templates.list.findIndex(t => t.id === processDraft.id);
        if (existingIdx >= 0) {
          state.orgDetail.templates.list[existingIdx] = record;
        } else {
          state.orgDetail.templates.list.unshift(record);
        }
      } else {
        const record = {
          id: processDraft.id,
          category: processDraft.category,
          req: processDraft.direction === '下发' ? '限时回执' : '回执',
          name: processDraft.name,
          org: '',
          createTime: createTime,
          direction: processDraft.direction,
          desc: processDraft.desc,
          status: '已发布',
          nodes: JSON.parse(JSON.stringify(processDraft.nodes)),
          formFields: JSON.parse(JSON.stringify(processDraft.formFields || []))
        };
        const existingIdx = state.templates.findIndex(t => t.id === processDraft.id);
        if (existingIdx >= 0) {
          state.templates[existingIdx] = record;
        } else {
          state.templates.unshift(record);
        }
      }

      closeProcessDesigner();
      showToast('流程发布成功');
      render();
    }

    function submitTemplateModal(isEdit, id) {
      if (!currentTplDraft) return;
      const name = (currentTplDraft.name || '').trim();
      const cat = currentTplDraft.category;
      const req = currentTplDraft.req;

      if (!name) {
        showToast('请输入模板名称');
        return;
      }
      if (!cat) {
        showToast('请选择指令类别');
        return;
      }

      const org = currentTplDraft.org || '';

      if (isEdit) {
        const item = state.templates.find(x => x.id === id);
        if (item) {
          item.name = name;
          item.category = cat;
          item.req = req;
          item.org = org;
          item.issueFields = JSON.parse(JSON.stringify(currentTplDraft.issueFields));
          item.receiptFields = JSON.parse(JSON.stringify(currentTplDraft.receiptFields));
        }
        closeModal();
        showToast('模板修改已保存');
      } else {
        const newId = 'TPL' + new Date().toISOString().slice(0,10).replace(/-/g,'') + String(Math.floor(1000 + Math.random() * 9000));
        const now = new Date();
        const createTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        state.templates.unshift({
          id: newId,
          name: name,
          category: cat,
          req: req,
          org: org,
          createTime: createTime,
          issueFields: JSON.parse(JSON.stringify(currentTplDraft.issueFields)),
          receiptFields: JSON.parse(JSON.stringify(currentTplDraft.receiptFields))
        });
        closeModal();
        showToast(org ? '新增机构模板成功' : '新增通用模板成功');
      }
      render();
    }

    function submitDeleteBizApp(catId, appId) {
      const cat = state.bizConfig.categories.find(c => c.id === catId);
      if (!cat) return;

      cat.apps = cat.apps.filter(a => a.id !== appId);

      if (state.bizConfig.currentApp === appId) {
        if (cat.apps.length > 0) {
          state.bizConfig.currentApp = cat.apps[0].id;
        } else {
          const otherCat = state.bizConfig.categories.find(c => c.apps && c.apps.length > 0);
          if (otherCat) {
            state.bizConfig.currentGroup = otherCat.id;
            state.bizConfig.currentApp = otherCat.apps[0].id;
          } else {
            state.bizConfig.currentApp = '';
          }
        }
      }

      closeModal();
      render();
      showToast('应用已删除');
    }

      const inputEl = document.getElementById('userFilterName');

      const focusedId = document.activeElement ? document.activeElement.id : null;
      const cursorPos = inputEl ? inputEl.selectionStart : 0;

      state.orgDetail.users.filters.name = inputEl?.value || '';
      state.orgDetail.users.filters.category = catEl?.value || '';
      render();

      if (focusedId) {
        const nextEl = document.getElementById(focusedId);
        if (nextEl) {
          nextEl.focus();
          if (nextEl.setSelectionRange && typeof cursorPos === 'number') {
            nextEl.setSelectionRange(cursorPos, cursorPos);
          }
        }
      }
    }

      const groupOptions = state.orgDetail.contacts.groups.filter(g => g.id !== 'all').map(g => `

    function submitGenerateInviteCode() {
      const group = document.getElementById('inviteCodeGroup')?.value || '未分组';
      const count = parseInt(document.getElementById('inviteCodeCount')?.value) || 1;
      const isYqcz = document.getElementById('inviteCatYqcz')?.checked;
      const isCwbs = document.getElementById('inviteCatCwbs')?.checked;

      if (count < 1 || count > 100) {
        showToast('生成数量需在 1 到 100 之间');
        return;
      }
      if (!isYqcz && !isCwbs) {
        showToast('请至少选择一个指令类别');
        return;
      }

      const cats = [];
      if (isYqcz) cats.push('舆情处置');
      if (isCwbs) cats.push('错误表述');
      const catStr = cats.join(' / ');

      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const timeStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

      const newCodes = [];
      for (let i = 0; i < count; i++) {
        const r1 = Math.floor(100 + Math.random() * 900);
        const r2 = Math.floor(100 + Math.random() * 900);
        const r3 = Math.floor(100 + Math.random() * 900);
        const code = `${r1}-${r2}-${r3}`;
        newCodes.push(code);
        if (!state.orgDetail.contacts.inactiveList) {
          state.orgDetail.contacts.inactiveList = [];
        }
        state.orgDetail.contacts.inactiveList.unshift({
          id: 'in_' + Date.now().toString(36) + '_' + i,
          code: code,
          group: group,
          remark: '-',
          createTime: timeStr,
          creator: '汪艳琼',
          category: catStr,
          categories: cats
        });
      }

      closeModal();
      state.orgDetail.contacts.subTab = 'inactive';
      render();

      const copyContent = newCodes.join('\n');
      showToast(`已成功生成 ${count} 个激活码`);
    }

      showToast(`成功导出未激活清单，共 ${list.length} 条数据`);
    }

    function handleApproverSearch(val) {
      approverSearchKey = val;
      const orgName = (state.orgDetail && state.orgDetail.activeOrgName) || '台湾省网信办';
      renderApproverModalDom(orgName);
      const searchInput = document.getElementById('approverSearchInput');
      if (searchInput) {
        searchInput.focus();
        searchInput.setSelectionRange(val.length, val.length);
      }
    }

    function toggleApproverTree() {
      approverTreeExpanded = !approverTreeExpanded;
      const orgName = (state.orgDetail && state.orgDetail.activeOrgName) || '台湾省网信办';
      renderApproverModalDom(orgName);
    }

    function toggleApproverSelectAll(checked) {
      const filteredList = approverStaffData.filter(u => !approverSearchKey || u.name.toLowerCase().includes(approverSearchKey.toLowerCase()));
      if (checked) {
        filteredList.forEach(u => {
          if (!selectedApproverIds.includes(u.id)) {
            selectedApproverIds.push(u.id);
          }
        });
      } else {
        const filteredIds = filteredList.map(u => u.id);
        selectedApproverIds = selectedApproverIds.filter(id => !filteredIds.includes(id));
      }
      const orgName = (state.orgDetail && state.orgDetail.activeOrgName) || '台湾省网信办';
      renderApproverModalDom(orgName);
    }

    function toggleApproverItem(id) {
      if (selectedApproverIds.includes(id)) {
        selectedApproverIds = selectedApproverIds.filter(x => x !== id);
      } else {
        selectedApproverIds.push(id);
      }
      const orgName = (state.orgDetail && state.orgDetail.activeOrgName) || '台湾省网信办';
      renderApproverModalDom(orgName);
    }

    function removeApproverItem(id) {
      selectedApproverIds = selectedApproverIds.filter(x => x !== id);
      const orgName = (state.orgDetail && state.orgDetail.activeOrgName) || '台湾省网信办';
      renderApproverModalDom(orgName);
    }

    function clearApproverSelection() {
      selectedApproverIds = [];
      const orgName = (state.orgDetail && state.orgDetail.activeOrgName) || '台湾省网信办';
      renderApproverModalDom(orgName);
    }

      const selectedNames = selectedApproverIds.map(id => {
        const u = approverStaffData.find(x => x.id === id);

        currentTplDraft.approver = approverStr;
      }
      closeModal();
      const inputEl = document.getElementById('orgTplApproverInput');
      if (inputEl) {
        inputEl.value = approverStr;
      }

            </div>

            <!-- 指令类别 & 指令要求 两列 (1:1 截图 4) -->
            <div class="mt-modal-two-cols" style="margin-bottom: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
              <div class="mt-col-item" style="display: flex; align-items: center; gap: 12px;">
                <span class="mt-col-label" style="width: 72px; min-width: 72px; text-align: right;"><span class="req">*</span>指令类别</span>
                <div style="flex: 1;">
                  <select class="mt-input-text" id="orgTplCatSelect" onchange="currentTplDraft.category=this.value">
                    <option value="">请选择指令类别</option>
                    <option value="舆情处置" ${currentTplDraft.category === '舆情处置' ? 'selected' : ''}>舆情处置</option>
                    <option value="错误表述" ${currentTplDraft.category === '错误表述' ? 'selected' : ''}>错误表述</option>
                  </select>
                </div>
              </div>
              <div class="mt-col-item" style="display: flex; align-items: center; gap: 12px;">
                <span class="mt-col-label" style="width: 72px; min-width: 72px; text-align: right;"><span class="req">*</span>指令要求</span>
                <div style="flex: 1;">
                  <select class="mt-input-text" id="orgTplReqSelect" onchange="currentTplDraft.req=this.value">
                    <option value="限时回执" ${currentTplDraft.req === '限时回执' ? 'selected' : ''}>限时回执</option>
                    <option value="回执" ${currentTplDraft.req === '回执' ? 'selected' : ''}>回执</option>
                    <option value="仅阅读" ${currentTplDraft.req === '仅阅读' ? 'selected' : ''}>仅阅读</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- 审批人 (1:1 截图 4) -->
            <div class="mt-modal-row" style="margin-bottom: 20px;">
              <label class="mt-modal-label" style="width: 72px; min-width: 72px;">审批人</label>
              <div class="mt-modal-control">
                <div style="display: flex; align-items: center; border: 1px solid #d9d9d9; border-radius: 4px; padding: 0 12px; height: 36px; background: #fff;">
                  <input type="text" id="orgTplApproverInput" readonly placeholder="请选择审批人" value="${currentTplDraft.approver || ''}" style="flex: 1; border: none; outline: none; background: transparent; font-size: 14px; color: #1e293b; cursor: pointer;" onclick="openSelectApproverModal()">
                  <a class="org-link" style="font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap;" onclick="openSelectApproverModal()">选择</a>
                </div>
              </div>
            </div>

            <!-- 模板内容 -->
            <div style="margin-top: 10px;">
              <div style="font-size: 14px; color: #334155; margin-bottom: 8px; font-weight: 500;">
                <span class="req" style="color:#ff4d4f;margin-right:4px;">*</span>模板内容
              </div>

              <!-- 指令下发内容 -->
              <div class="mt-tpl-content-block" style="margin-top: 6px;">
                <div class="mt-tpl-section-header">
                  <span>指令下发内容</span>
                  <button type="button" class="mt-tpl-add-btn" onclick="addTplField('issue')">
                    <i data-lucide="plus" width="14" height="14"></i>
                    <span>添加</span>
                  </button>
                </div>
                <div class="mt-tpl-table-head">
                  <div></div>
                  <div>控件</div>
                  <div>标题</div>
                  <div>是否必填</div>
                  <div>提示信息</div>
                  <div>默认值</div>
                  <div style="text-align: center;">操作</div>
                </div>
                <div id="tplContainer_issue">
                  ${renderTplFieldsTable('issue')}
                </div>
              </div>

              <!-- 指令回执内容 -->
              <div class="mt-tpl-content-block" style="margin-top: 14px;">
                <div class="mt-tpl-section-header">
                  <span>指令回执内容</span>
                  <button type="button" class="mt-tpl-add-btn" onclick="addTplField('receipt')">
                    <i data-lucide="plus" width="14" height="14"></i>
                    <span>添加</span>
                  </button>
                </div>
                <div class="mt-tpl-table-head">
                  <div></div>
                  <div>控件</div>
                  <div>标题</div>
                  <div>是否必填</div>
                  <div>提示信息</div>
                  <div>默认值</div>
                  <div style="text-align: center;">操作</div>
                </div>
                <div id="tplContainer_receipt">
                  ${renderTplFieldsTable('receipt')}
                </div>
              </div>
            </div>
          </div>

          <div class="mt-modal-footer" style="justify-content: space-between; margin-top: 24px;">
            <div>
              <button type="button" class="mt-preview-link-btn" onclick="previewCurrentTemplate()">
                <i data-lucide="eye" width="16" height="16"></i>
                <span>预览</span>
              </button>
            </div>
            <div style="display: flex; gap: 12px;">
              <button class="mt-btn-cancel" onclick="closeModal()">取消</button>
              <button class="mt-btn-confirm" onclick="submitOrgTemplateModal(false, null, true)">确定</button>
            </div>
          </div>
        </div>
      `, 'wide');
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function submitOrgTemplateModal(isEdit, tplId, isCopy = false) {
      if (!currentTplDraft) return;
      const name = (currentTplDraft.name || '').trim();
      const cat = currentTplDraft.category;
      const req = currentTplDraft.req;
      const approver = currentTplDraft.approver || '';
      const org = (currentTplDraft.org || '台湾省网信办').trim();

      if (isCopy && !org) {
        showToast('请输入机构名称');
        return;
      }
      if (!name) {
        showToast('请输入模板名称');
        return;
      }
      if (!cat) {
        showToast('请选择指令类别');
        return;
      }
      if (!req) {
        showToast('请选择指令要求');
        return;
      }

      const catKey = (cat === '错误表述') ? 'cwbs' : 'yqcz';

      if (isEdit) {
        const item = state.orgDetail.templates.list.find(x => x.id === tplId);
        if (item) {
          item.name = name;
          item.category = catKey;
          item.req = req;
          item.approver = approver;
          item.org = org;
          item.issueFields = JSON.parse(JSON.stringify(currentTplDraft.issueFields));
          item.receiptFields = JSON.parse(JSON.stringify(currentTplDraft.receiptFields));
        }
        closeModal();
        showToast('机构模板修改已保存');
      } else {
        const randomHex = Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 8);
        const newId = 'TP' + randomHex;
        const now = new Date();
        const createTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        
        state.orgDetail.templates.list.unshift({
          id: newId,
          req: req,
          type: '机构模板',
          name: name,
          createTime: createTime,
          visible: true,
          category: catKey,
          org: org,
          approver: approver,
          issueFields: JSON.parse(JSON.stringify(currentTplDraft.issueFields)),
          receiptFields: JSON.parse(JSON.stringify(currentTplDraft.receiptFields))
        });
        closeModal();
        showToast(isCopy ? '复制模板成功' : '新增机构模板成功');
      }
      render();
    }

    /* 6. 机构详情-机构模板：删除模板确认弹窗 (1:1 截图 5) */
    function openDeleteOrgTemplateModal(tplId) {
      openModalCustom(`
        <div class="mt-modal-inner" style="max-width: 420px; width: 420px; padding: 24px 28px 20px;">
          <div class="mt-confirm-header" style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
            <span class="mt-confirm-icon" style="background:#fa8c16; color:#fff; width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px;">!</span>
            <span class="mt-confirm-title" style="font-size:16px; font-weight:700; color:#1e293b;">您确认删除该模板吗？</span>
            <button class="mt-modal-close" style="margin-left:auto;" onclick="closeModal()">✕</button>
          </div>
          <div class="mt-confirm-desc" style="margin-left:32px; font-size:14px; color:#595959;">
            删除后<span style="color:#ff4d4f;">不可恢复，请谨慎操作！</span>
          </div>
          <div class="mt-modal-footer" style="margin-top:24px; justify-content:flex-end; gap:10px;">
            <button class="mt-btn-cancel" onclick="closeModal()">取消</button>
            <button class="mt-btn-confirm" onclick="submitDeleteOrgTemplate('${tplId}')">确定</button>
          </div>
        </div>
      `, true);
    }

    function submitDeleteOrgTemplate(tplId) {
      state.orgDetail.templates.list = state.orgDetail.templates.list.filter(t => t.id !== tplId);
      closeModal();
      showToast('模板已删除');
      render();
    }

    /* 2. 机构详情-机构模板：查看模板弹窗 (带机构和审批人字段，1:1 截图 2) */
    function openViewTemplateModal(tplId) {
      const t = state.orgDetail.templates.list.find(x => x.id === tplId);
      if (!t) return;

      const issueFields = t.issueFields || [];
      const receiptFields = t.receiptFields || [];
      const catLabel = t.category === 'cwbs' ? '错误表述' : '舆情处置';
      const orgName = t.org || (state.orgDetail && state.orgDetail.activeOrgName) || '台湾省网信办';

      function renderFieldDisplayItem(f) {
        const isReq = f.required === '必填';
        const reqBadge = isReq ? `<span class="req" style="color:#ff4d4f;margin-right:4px;">*</span>` : '';

        if (f.type === '图片上传') {
          return `
            <div class="mt-view-field-item" style="margin-bottom:16px;">
              <label class="mt-view-field-label" style="font-size:13px; color:#334155; margin-bottom:6px; display:block; font-weight:500;">
                ${reqBadge}${f.title || '图片'} <span style="color:#8c8c8c;font-size:12px;font-weight:400;">(${f.placeholder || '只支持格式JPG、GIF、PNG，且大小不超过10M。'})</span>
              </label>
              <div class="mt-view-img-upload">
                <i data-lucide="plus" width="20" height="20"></i>
                <span>上传图片</span>
              </div>
            </div>
          `;
        }

        if (f.type === '文件上传') {
          return `
            <div class="mt-view-field-item" style="margin-bottom:16px;">
              <label class="mt-view-field-label" style="font-size:13px; color:#334155; margin-bottom:6px; display:block; font-weight:500;">
                ${reqBadge}${f.title || '文件'}
              </label>
              <div class="mt-view-file-upload">
                <i data-lucide="cloud-upload" width="36" height="36" class="mt-view-file-cloud"></i>
                <div style="font-size: 13px; color: #1e293b; font-weight: 500;">点击或拖拽文件上传</div>
                <div style="font-size: 12px; color: #8c8c8c;">${f.placeholder || '支持DOC、DOCX、XLS、XISX、PPT等，且文件大小不超过10M'}</div>
              </div>
            </div>
          `;
        }

        if (f.type === '多行文本') {
          return `
            <div class="mt-view-field-item" style="margin-bottom:16px;">
              <label class="mt-view-field-label" style="font-size:13px; color:#334155; margin-bottom:6px; display:block; font-weight:500;">
                ${reqBadge}${f.title || '多行文本'}
              </label>
              <textarea class="mt-view-textarea" placeholder="${f.placeholder || '请填写内容'}" readonly></textarea>
            </div>
          `;
        }

        return `
          <div class="mt-view-field-item" style="margin-bottom:16px;">
            <label class="mt-view-field-label" style="font-size:13px; color:#334155; margin-bottom:6px; display:block; font-weight:500;">
              ${reqBadge}${f.title || '标题'}
            </label>
            <input type="text" class="mt-input-text" placeholder="${f.placeholder || '请输入提示信息'}" readonly style="background:#fff;">
          </div>
        `;
      }

      openModalCustom(`
        <div class="mt-modal-inner" style="max-height: 88vh; display: flex; flex-direction: column;">
          <div class="mt-modal-header" style="margin-bottom: 12px;">
            <h3 class="mt-modal-title">查看</h3>
            <button class="mt-modal-close" onclick="closeModal()">✕</button>
          </div>

          <div class="mt-modal-body" style="overflow-y: auto; padding-right: 4px;">
            <!-- 头部信息 (1:1 截图 2: 包含了机构和审批人) -->
            <div class="mt-view-header" style="margin-bottom:18px;">
              <div class="mt-view-title-row" style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
                <span class="mt-tag-cat-brown" style="background:#f1f5f9; color:#475569; border:1px solid #e2e8f0; font-size:12px; font-weight:600; padding:2px 8px; border-radius:4px;">${catLabel}</span>
                <span class="mt-view-name" style="font-size:16px; font-weight:700; color:#1e293b;">${t.name}</span>
              </div>
              <div class="mt-view-meta-row" style="display:flex; flex-wrap:wrap; gap:36px; font-size:13px; color:#595959; margin-bottom:6px;">
                <span style="display:inline-flex;align-items:center;gap:4px">
                  <span>模板ID：${t.id}</span>
                  <button type="button" class="mt-copy-id-btn" onclick="copyText('${t.id}', '模板ID')" title="复制ID">
                    <i data-lucide="copy" width="12" height="12"></i>
                  </button>
                </span>
                <span>指令要求：${t.req}</span>
                <span>机构：${orgName}</span>
              </div>
              <div class="mt-view-meta-row" style="font-size:13px; color:#595959;">
                <span>审批人：${t.approver || '-'}</span>
              </div>
            </div>

            <!-- 展示容器 (1:1 截图 2 带倾斜水印) -->
            <div class="mt-view-container" style="position:relative; background:#fafafa; border:1px solid #e8e8e8; border-radius:6px; padding:20px 24px;">
              <!-- 模板展示印章水印 (1:1 截图 2) -->
              <div class="mt-watermark-stamp" style="position:absolute; top:20px; right:28px; border:2px dashed #cbd5e1; border-radius:6px; padding:6px 18px; color:#94a3b8; font-size:16px; font-weight:700; letter-spacing:2px; transform:rotate(-12deg); user-select:none; pointer-events:none;">
                模板展示
              </div>

              <!-- 指令下发卡片 (1:1 截图 2) -->
              <div class="mt-view-section" style="background:#ffffff; border:1px solid #f0f0f0; border-radius:6px; padding:16px 20px; margin-bottom:16px;">
                <div class="mt-view-sec-title" style="font-size:14px; font-weight:600; color:#1e293b; display:flex; align-items:center; gap:8px; margin-bottom:16px;">
                  <span style="display:inline-block; width:3px; height:14px; background:#1677ff; border-radius:2px;"></span>
                  <span>指令下发</span>
                </div>
                ${issueFields.length > 0 ? issueFields.map(f => renderFieldDisplayItem(f)).join('') : `
                  <div style="color:#8c8c8c; font-size:13px; text-align:center; padding:16px 0;">暂无下发内容字段</div>
                `}
              </div>

              <!-- 指令回执卡片 (限时回执或回执时展示) -->
              ${t.req !== '仅阅读' ? `
                <div class="mt-view-section" style="background:#ffffff; border:1px solid #f0f0f0; border-radius:6px; padding:16px 20px;">
                  <div class="mt-view-sec-title" style="font-size:14px; font-weight:600; color:#1e293b; display:flex; align-items:center; gap:8px; margin-bottom:16px;">
                    <span style="display:inline-block; width:3px; height:14px; background:#1677ff; border-radius:2px;"></span>
                    <span>指令回执</span>
                  </div>
                  ${receiptFields.length > 0 ? receiptFields.map(f => renderFieldDisplayItem(f)).join('') : `
                    <div style="color:#8c8c8c; font-size:13px; text-align:center; padding:16px 0;">暂无回执内容字段</div>
                  `}
                </div>
              ` : ''}
            </div>
          </div>

          <!-- 底部 (1:1 截图 2: 单个关闭按钮) -->
          <div class="mt-modal-footer" style="justify-content: flex-end; margin-top: 20px;">
            <button class="mt-btn-confirm" onclick="closeModal()">关闭</button>
          </div>
        </div>
      `, 'wide');
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function copyText(text, label = '内容') {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`已复制${label}: ${text}`);
      }).catch(() => {
        showToast(`已复制${label}: ${text}`);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
